name: Release

# Builds a universal (Apple Silicon + Intel) binary for a version tag and publishes it,
# with SHA256SUMS, as a GitHub release. install.sh downloads exactly these assets.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  ASSET: usb-android-tethering-macos-universal.tar.gz

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != Cargo.toml v$version"; exit 1; }

      - name: Validate packaging scripts
        run: sh -n install.sh scripts/check-install.sh scripts/brew/update-tap.sh

      - name: Test
        run: cargo test --locked

      - name: Build both architectures
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p dist
          lipo -create -output dist/usb-android-tethering \
            target/aarch64-apple-darwin/release/usb-android-tethering \
            target/x86_64-apple-darwin/release/usb-android-tethering
          codesign --force --sign - dist/usb-android-tethering   # ad-hoc signature for arm64
          archs=$(lipo -archs dist/usb-android-tethering)
          echo "archs: $archs"
          case $archs in *arm64*) ;; *) echo "missing arm64 slice"; exit 1 ;; esac
          case $archs in *x86_64*) ;; *) echo "missing x86_64 slice"; exit 1 ;; esac
          ./dist/usb-android-tethering --version > v.txt
          case "$(cat v.txt)" in
            *" ${GITHUB_REF_NAME#v}") ;;
            *) echo "binary says '$(cat v.txt)', tag is $GITHUB_REF_NAME"; exit 1 ;;
          esac

      - name: Package and checksum
        run: |
          cp LICENSE-MIT LICENSE-APACHE README.md dist/
          tar -czf "$ASSET" -C dist usb-android-tethering LICENSE-MIT LICENSE-APACHE README.md
          tar -tzf "$ASSET"
          shasum -a 256 "$ASSET" > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ### Install

          ```sh
          curl -fsSL https://raw.githubusercontent.com/frosty-universe/usb-android-tethering/main/install.sh | sh
          ```
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ASSET" SHA256SUMS \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag

      # Runs only when the secret exists, so a release never fails because the tap is unset.
      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::warning::TAP_TOKEN is not set; skipping the Homebrew tap update"
            exit 0
          fi
          tap="$RUNNER_TEMP/tap"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TAP_TOKEN" | base64)"
          git init -q "$tap"
          git -C "$tap" remote add origin https://github.com/frosty-universe/homebrew-usb-android-tethering.git
          git -C "$tap" -c http.extraheader="$auth" pull --depth 1 origin main
          TAP_DIR="$tap" scripts/brew/update-tap.sh "$GITHUB_REF_NAME"
          TAP_DIR="$tap" scripts/brew/update-tap.sh --check "$GITHUB_REF_NAME"
          if git -C "$tap" diff --quiet; then
            echo "tap formula already up to date"
            exit 0
          fi
          git -C "$tap" add Formula/usb-android-tethering.rb
          git -C "$tap" \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "usb-android-tethering $GITHUB_REF_NAME"
          git -C "$tap" -c http.extraheader="$auth" push origin HEAD:main
