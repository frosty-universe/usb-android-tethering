name: Release

# Checks a version tag, publishes GitHub release notes, and updates the Homebrew tap.
# No executable is attached. install.sh and the tap both build the tagged source.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != Cargo.toml v$version"; exit 1; }

      - name: Validate packaging scripts
        run: |
          for script in install.sh scripts/check-install.sh scripts/brew/update-tap.sh; do
            sh -n "$script"
          done

      - name: Test
        run: cargo test --locked

      - name: Release notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ### Install

          No prebuilt binary is attached. Homebrew builds the tagged source:

          ```sh
          brew install frosty-universe/usb-android-tethering/usb-android-tethering
          sudo usb-android-tethering install
          ```

          Or, with Rust 1.88+ already installed:

          ```sh
          curl -fsSL https://raw.githubusercontent.com/frosty-universe/usb-android-tethering/main/install.sh | sh
          ```
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag

      # Runs only when the secret exists, so a release never fails because the tap is unset.
      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::warning::TAP_TOKEN is not set; skipping the Homebrew tap update"
            exit 0
          fi
          tap="$RUNNER_TEMP/tap"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TAP_TOKEN" | base64)"
          git init -q "$tap"
          git -C "$tap" remote add origin https://github.com/frosty-universe/homebrew-usb-android-tethering.git
          git -C "$tap" -c http.extraheader="$auth" pull --depth 1 origin main
          TAP_DIR="$tap" scripts/brew/update-tap.sh "$GITHUB_REF_NAME"
          TAP_DIR="$tap" scripts/brew/update-tap.sh --check "$GITHUB_REF_NAME"
          if git -C "$tap" diff --quiet; then
            echo "tap formula already up to date"
            exit 0
          fi
          git -C "$tap" add Formula/usb-android-tethering.rb
          git -C "$tap" \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "usb-android-tethering $GITHUB_REF_NAME"
          git -C "$tap" -c http.extraheader="$auth" push origin HEAD:main
