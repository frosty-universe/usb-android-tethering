name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · test · build (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon
            toolchain: stable
          - os: macos-15-intel # Intel (x86_64)
            toolchain: stable
          - os: macos-latest # minimum supported Rust version (rust-version in Cargo.toml)
            toolchain: "1.88"
    steps:
      # Actions are pinned to commit SHAs (tag in the trailing comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build (release)
        run: cargo build --locked --release

      - name: Smoke test (no root, no phone required)
        run: |
          ./target/release/usb-android-tethering --version
          ./target/release/usb-android-tethering --help > /dev/null
          ./target/release/usb-android-tethering devices --json
          ./target/release/usb-android-tethering status --json

      - name: Upload binary
        if: matrix.toolchain == 'stable'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: usb-android-tethering-${{ runner.arch }}
          path: target/release/usb-android-tethering
          if-no-files-found: error
