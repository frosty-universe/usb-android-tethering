version: 2
# Weekly, one PR per ecosystem. Workflow actions stay pinned to commit SHAs
# (the `# vX.Y.Z` comment on each `uses:` line is what Dependabot updates).
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
