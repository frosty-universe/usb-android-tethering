name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you file this
      options:
        - label: I searched the existing issues and this isn't already requested
          required: true
        - label: This fits the project's scope (macOS USB tethering, no kernel extension)
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Command-line examples are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
