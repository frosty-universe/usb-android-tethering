name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Security issues must **not** be reported here; see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `usb-android-tethering --version` (or the commit hash)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      description: The macOS release and the chip, for example "macOS 26.7 on an M4 MacBook Air" or "macOS 15.8 on an Intel MacBook Pro (2019)".
      placeholder: macOS 26.7, MacBook Air (M4) — or macOS 15.8, MacBook Pro 16-inch (2019, Intel)
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone model and Android version
      placeholder: Samsung Galaxy S24, Android 16
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: How are you running it?
      options:
        - Background service (`install`)
        - Foreground (`sudo usb-android-tethering run`)
        - Read-only commands only (`status`, `devices`, `probe`)
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Output of `usb-android-tethering devices --json` and `usb-android-tethering status --json`
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Attach `/var/log/usb-android-tethering.log`, or run in the foreground with `sudo usb-android-tethering run -vv`.
        Remove anything you consider private (for example public IP addresses).
      render: text
  - type: input
    id: vpn
    attributes:
      label: VPN or proxy software in use (if any)
